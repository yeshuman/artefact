[pytest]
DJANGO_SETTINGS_MODULE = artefact.settings
python_files = tests.py test_*.py *_tests.py
asyncio_mode = auto
addopts = --reuse-db --no-migrations
markers =
    mock: mark test as using mock LLM responses
    real: mark test as using real LLM API
    asyncio: mark test as async
    django_db: mark tests that need database access
filterwarnings =
    ignore::DeprecationWarning
    ignore::django.utils.deprecation.RemovedInDjango60Warning