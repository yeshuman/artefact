[pytest]
DJANGO_SETTINGS_MODULE = artefact.settings
python_files = tests.py test_*.py *_tests.py
markers =
    asyncio: mark a test as an async test
    django_db: mark a test as requiring database access
    real: mark a test as using real external APIs
    mock: mark a test as using mock data
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*:
    ignore::DeprecationWarning:polymorphic.*: 